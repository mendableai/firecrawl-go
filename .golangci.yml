version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofumpt

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    - misspell
    - bodyclose
    - noctx
    - gosec
    - prealloc

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      disable:
        - fieldalignment
    gosec:
      excludes:
        - G402  # TLS InsecureSkipVerify (user controls this)
