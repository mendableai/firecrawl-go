run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    - gofumpt
    - misspell
    - bodyclose
    - noctx
    - gosec
    - prealloc

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    disable:
      - fieldalignment
  gosec:
    excludes:
      - G402  # TLS InsecureSkipVerify (user controls this)
